name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  # Called by the Release workflow: a tag publishes nothing until these pass,
  # and what it publishes is what the package job built.
  workflow_call:

# The group is spelt out: in a called workflow github.workflow is the caller's
# name, and the group would be the Release workflow's own, which is a deadlock.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - name: Lint the extension
      run: |
        set -eux
        jlpm
        jlpm run lint:check

    - name: Frontend test
      run: |
        set -eux
        jlpm run test

    - name: Build the extension
      run: |
        set -eux
        python -m pip install .[test]
        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "jupyter_server_nbmodel.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "jupyter-server-nbmodel.*OK"

        python -m jupyterlab.browser_check

    - name: Python test
      run: |
        set -eux
        pytest

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "jupyter_server_nbmodel" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v7
      with:
        name: extension-artifacts
        path: dist/jupyter_server_nbmodel*
        if-no-files-found: error

  # Builds the packages a release publishes, the way a release builds them,
  # from a clean tree: on a pull request this is the check that a release
  # would build, on a tag it is the build (release.yaml).
  package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install the tools
      run: python -m pip install -U "jupyterlab>=4.0.0,<5" build check-wheel-contents twine

    # Under dist/, which .gitignore covers: the sdist takes any other new folder.
    - name: Pack the npm package
      run: |
        set -eux
        jlpm
        jlpm build:prod
        mkdir -p dist/npm
        npm pack --pack-destination dist/npm

    # clean:all removes lib/, the labextension and _version.py, so the wheel
    # holds what hatch-jupyter-builder builds and nothing left over from npm.
    - name: Build the Python package
      run: |
        set -eux
        jlpm clean:all
        python -m build --outdir dist/python

    - name: Check the packages
      run: |
        set -euo pipefail
        version="$(node -p "require('./package.json').version")"
        tarball="dist/npm/datalayer-jupyter-server-nbmodel-${version}.tgz"
        wheel="dist/python/jupyter_server_nbmodel-${version}-py3-none-any.whl"
        sdist="dist/python/jupyter_server_nbmodel-${version}.tar.gz"
        test -f "$tarball"
        test -f "$wheel"
        test -f "$sdist"

        # node_modules and .yarn stay out only through .gitignore; PyPI holds
        # a file to 100 MB, and this one is well under 1 MB.
        test "$(stat -c %s "$sdist")" -lt 10000000

        twine check --strict dist/python/*
        check-wheel-contents "$wheel"

        # Listed to files first: `grep -q` closing a pipe early would fail
        # the listing under pipefail.
        tar -tzf "$tarball" > "$RUNNER_TEMP/npm-files.txt"
        python -m zipfile -l "$wheel" > "$RUNNER_TEMP/wheel-files.txt"
        tar -tzf "$sdist" > "$RUNNER_TEMP/sdist-files.txt"

        grep -q '^package/lib/index\.js$' "$RUNNER_TEMP/npm-files.txt"
        grep -q '^package/style/index\.js$' "$RUNNER_TEMP/npm-files.txt"

        labextension="jupyter_server_nbmodel-${version}.data/data/share/jupyter/labextensions/@datalayer/jupyter-server-nbmodel"
        for file in package.json install.json static/style.js; do
          grep -qF "$labextension/$file" "$RUNNER_TEMP/wheel-files.txt"
        done
        grep -qF "etc/jupyter/jupyter_server_config.d/jupyter_server_nbmodel.json" "$RUNNER_TEMP/wheel-files.txt"
        grep -qF "jupyter_server_nbmodel/labextension/static/style.js" "$RUNNER_TEMP/sdist-files.txt"

        # The labextension and the Python package carry the version too.
        labextension_version="$(unzip -p "$wheel" "$labextension/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
        echo "npm=$version labextension=$labextension_version"
        test "$version" = "$labextension_version"
        unzip -p "$wheel" jupyter_server_nbmodel/_version.py | grep -qF "'$version'"

    - name: Upload the npm package
      uses: actions/upload-artifact@v7
      with:
        name: npm-package
        path: dist/npm/*.tgz
        if-no-files-found: error

    - name: Upload the Python packages
      uses: actions/upload-artifact@v7
      with:
        name: python-packages
        path: dist/python/*
        if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        architecture: 'x64'
    - uses: actions/download-artifact@v8
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.0.0,<5" jupyter_server_nbmodel*.whl


        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "jupyter_server_nbmodel.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "jupyter-server-nbmodel.*OK"
        python -m jupyterlab.browser_check --no-browser-test

  integration-tests:
    name: Integration tests
    needs: build
    # Playwright cannot install Chromium on ubuntu-26.04, which ubuntu-latest now is.
    runs-on: ubuntu-24.04

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Download extension package
      uses: actions/download-artifact@v8
      with:
        name: extension-artifacts

    - name: Install the extension
      run: |
        set -eux
        python -m pip install "jupyterlab>=4.0.0,<5" jupyter_server_nbmodel*.whl

    - name: Install dependencies
      working-directory: ui-tests
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 0
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: jlpm install

    - name: Set up browser cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ github.workspace }}/pw-browsers
        key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

    - name: Install browser
      run: jlpm playwright install chromium
      working-directory: ui-tests

    - name: Execute integration tests
      working-directory: ui-tests
      run: |
        jlpm playwright test

    - name: Upload Playwright Test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jupyter_server_nbmodel-playwright-tests
        path: |
          ui-tests/test-results
          ui-tests/playwright-report

  check_links:
    name: Check Links
    # A link that dies out there is no reason to hold a release back.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
